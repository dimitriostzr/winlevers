# Builds the portable zips and installers for x64 and ARM64 and publishes them as the
# one GitHub release. Only the latest build is kept: every run deletes the older
# releases, and the tags behind them, before publishing the new one, so the Releases
# page never offers an outdated copy.
#
# Runs on every push to main that changes what ends up in the app, and by hand from
# the Actions tab. The version comes from <Version> in Directory.Build.props.

name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/Build-Release.ps1'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/release.yml'
      - '.github/release-notes.md'
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: a run cancelled between deleting the old release and
# creating the new one would leave the page empty.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet test WinLevers.Engine.slnx -c Release

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: artifacts/release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)"
          tag="v$version"

          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag
          done
          # A tag left without a release would pin the new one to an old commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>/dev/null || true

          gh release create "$tag" dist/* --target "$GITHUB_SHA" --latest \
            --title "WinLevers $version" --notes-file .github/release-notes.md
